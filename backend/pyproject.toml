[project]
name = "cognix-backend"
version = "0.1.0"
description = "Local-first backend for the Cognix Personal Neural Library."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "pypdf>=4.2.0",
  "chromadb>=0.5.0",
  "watchdog>=4.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
