[project]
name = "cognix-backend"
version = "0.1.0"
description = "Local-first backend for the Cognix Personal Neural Library."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.3.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "pypdf>=4.2.0",
  "chromadb>=0.5.0",
  "watchdog>=4.0.0",
  "apscheduler>=3.10.4"
]

[project.optional-dependencies]
ml = [
  "sentence-transformers>=3.0.0"
]
training = [
  "accelerate>=0.33.0",
  "datasets>=2.20.0",
  "peft>=0.12.0",
  "torch>=2.3.0",
  "transformers>=4.44.0",
  "trl>=0.9.6"
]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["evals*", "training*", "tests*"]
